name: Update prices

on:
  schedule:
    # Weekday evenings: 21:35 UTC (4:35pm EST / 5:35pm EDT), after the close.
    # GitHub often starts this 2-5 hours late.
    - cron: "35 21 * * 1-5"
    # Backstop: Tue-Sat mornings, 11:15 UTC (6:15am EST / 7:15am EDT).
    # Yahoo has finalized the prior session by then, so this always lands
    # the previous trading day's close even if the evening run came back stale.
    - cron: "15 11 * * 2-6"
  workflow_dispatch: {}   # manual "Run workflow" button for on-demand refresh

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch prices
        run: python fetch_prices.py

      - name: Commit prices.json if changed
        run: |
          git config user.name "price-bot"
          git config user.email "actions@github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "No price changes — nothing to commit."
          else
            git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --quiet
            git push
          fi
